    /**
     * Pure-JS + WebCrypto SHA-256 implementation so hashing works identically
     * in HTTPS, localhost, and sandboxed iframe environments without exposing plain text.
     */
    async function sha256Hex(message) {
      const normalized = String(message);
      if (window.crypto && window.crypto.subtle) {
        try {
          const msgBuffer = new TextEncoder().encode(normalized);
          const hashBuffer = await window.crypto.subtle.digest("SHA-256", msgBuffer);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map((b) => b.toString(16).padStart(2, "0")).join("");
        } catch (e) {
          // Fallback to pure JS SHA-256 if subtle crypto is restricted
        }
      }
      return pureJsSha256(normalized);
    }

    function pureJsSha256(ascii) {
      function rightRotate(value, amount) {
        return (value >>> amount) | (value << (32 - amount));
      }
      const mathPow = Math.pow;
      const maxWord = mathPow(2, 32);
      let result = "";
      const words = [];
      const asciiBitLength = ascii.length * 8;
      const hash = [];
      const k = [];
      let primeCounter = 0;
      const isComposite = {};
      for (let candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
          hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
        }
      }
      ascii += "\x80";
      while ((ascii.length % 64) - 56) ascii += "\x00";
      for (let i = 0; i < ascii.length; i++) {
        const j = ascii.charCodeAt(i);
        words[i >> 2] |= j << (((3 - i) % 4) * 8);
      }
      words[words.length] = (asciiBitLength / maxWord) | 0;
      words[words.length] = asciiBitLength;
      for (let j = 0; j < words.length;) {
        const w = words.slice(j, (j += 16));
        const oldHash = hash.slice(0);
        for (let i = 0; i < 64; i++) {
          const w15 = w[i - 15], w2 = w[i - 2];
          const a = hash[0], e = hash[4];
          const temp1 =
            hash[7] +
            (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) +
            ((e & hash[5]) ^ (~e & hash[6])) +
            k[i] +
            (w[i] =
              i < 16
                ? w[i]
                : (w[i - 16] +
                    (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) +
                    w[i - 7] +
                    (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) |
                  0);
          const temp2 =
            (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) +
            ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
          hash.unshift((temp1 + temp2) | 0);
          hash.pop();
          hash[4] = (hash[4] + temp1) | 0;
        }
        for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
      }
      for (let i = 0; i < 8; i++) {
        for (let j = 3; j + 1; j--) {
          const b = (hash[i] >> (j * 8)) & 255;
          result += (b < 16 ? 0 : "") + b.toString(16);
        }
      }
      return result;
    }

    /**
     * Cloudinary unsigned upload via Fetch API FormData.
     */
    async function uploadPosterToCloudinary(file, onStatus) {
      const { cloudName, uploadPreset } = CLOUD_CONFIG.cloudinaryConfig;
      const endpoint = `https://api.cloudinary.com/v1_1/${encodeURIComponent(cloudName)}/image/upload`;
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", uploadPreset);

      if (onStatus) onStatus("Uploading poster to Cloudinary...");
      const response = await fetch(endpoint, {
        method: "POST",
        body: formData
      });
      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`Cloudinary upload failed (${response.status}): ${errText}`);
      }
      const data = await response.json();
      if (!data.secure_url) {
        throw new Error("Cloudinary response did not include secure_url.");
      }
      if (onStatus) onStatus("Uploaded to Cloudinary!");
      return data.secure_url;
    }

    function readFileAsDataUrl(file) {

        const reader = new FileReader();

        reader.readAsDataURL(file);
      });
    }
